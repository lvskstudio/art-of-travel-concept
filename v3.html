<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варіант 3 · Кружка — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2.css?v=r4a">
<style>
body{background:#1c2a1f;color:#fff}
.hero{position:relative;height:100vh;height:100svh;min-height:620px;overflow:hidden}
/* the same photo, blurred, fills the screen around the card (GORNEE ref) */
.bg{position:absolute;inset:-4%;z-index:0}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.bg img.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:rgba(2,26,82,.28)}
/* the card: big, almost the whole screen; the photo is whole inside it (no frosted half) */
.card{position:absolute;z-index:2;left:5.2vw;right:5.2vw;top:11vh;bottom:11vh;border-radius:26px;overflow:hidden;border:1.2px solid rgba(255,255,255,.7);box-shadow:0 30px 90px rgba(0,0,0,.35)}
.card .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1s,transform 6s ease-out}
.card .ph.on{opacity:1;transform:scale(1)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,16,40,.55) 0%,rgba(2,16,40,.12) 45%,rgba(2,16,40,0) 70%),linear-gradient(0deg,rgba(2,16,40,.35),rgba(2,16,40,0) 40%);pointer-events:none}
.in{position:absolute;inset:0;z-index:3}
.h0{opacity:0}
.contact{position:absolute;left:34px;top:30px;font:500 14px/1 var(--sans)}
.contact div{margin-top:14px;display:flex;gap:10px}
.contact a.ic{width:30px;height:30px;border:1px solid rgba(255,255,255,.75);border-radius:8px;display:grid;place-items:center;font:600 10px/1 var(--sans)}
.menu{position:absolute;right:34px;top:28px;display:flex;align-items:center;gap:30px;font:500 14px/1 var(--sans)}
.menu a:hover{color:var(--gold)}
.menu .pill{border:1px solid rgba(255,255,255,.85);border-radius:30px;padding:12px 20px}
.menu .pill:hover{background:#fff;color:var(--navy)}
.logo{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:54px}
/* big offset title like "GORNEE / TYR" */
.ttl{position:absolute;left:5%;right:5%;top:12%;font:200 clamp(48px,7.2vw,132px)/.92 var(--sans);text-transform:uppercase;letter-spacing:.02em;pointer-events:none;text-shadow:0 2px 40px rgba(0,0,0,.25)}
.ttl span{display:block}
.ttl .l2{padding-left:38%}
.ttl span em{display:inline-block;font-style:normal}
.info{position:absolute;left:34px;bottom:36px;max-width:400px}
.info h3{font:600 clamp(24px,2.2vw,32px)/1.15 var(--sans);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:7px}
.info p{margin-top:14px;font-size:16px;line-height:1.5;opacity:.92}
.info a{display:inline-block;margin-top:22px;border:1.5px solid rgba(255,255,255,.9);border-radius:30px;padding:14px 30px;font:500 17px/1 var(--sans);background:rgba(255,255,255,.08)}
.info a:hover{background:#fff;color:var(--navy)}
/* vertical switcher with the diamond + prev / next (switch the real photos) */
.vs{position:absolute;right:40px;top:30%;height:40%;width:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.vs::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.75)}
.vs button{position:relative;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent}
.vs .up{border-bottom:11px solid #fff}.vs .dn{border-top:11px solid #fff}
.vs b{position:relative;width:16px;height:16px;border:1.5px solid #fff;transform:rotate(45deg);background:rgba(2,26,82,.35)}
.place{position:absolute;right:34px;bottom:36px;display:flex;align-items:center;gap:14px}
.place span{font:500 13px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-right:12px;transition:opacity .4s}
.place button{width:62px;height:30px;border:1px solid rgba(255,255,255,.8);border-radius:4px;background:rgba(255,255,255,.12);color:#fff;font-size:11px}
.place button:hover{background:#fff;color:var(--navy)}
/* intro: steam → camera drifts in → mist */
.intro{position:absolute;inset:0;z-index:40;overflow:hidden;background:#EDE5D8}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 26%;will-change:transform}
.mist{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#F6F0E6,#E7DDCE);opacity:0;pointer-events:none}
@media (max-width:860px){
  .card{left:12px;right:12px;top:56px;bottom:20px;border-radius:22px}
  .contact,.menu a:not(.mm),.vs{display:none}
  .menu{right:20px;top:20px}.menu .mm{display:block!important}
  .logo{left:24px;transform:none;top:16px;width:42px}
  .ttl{top:16%;font-size:17vw}.ttl .l2{padding-left:18%}
  .info{left:20px;right:20px;bottom:76px;max-width:none}
  .info p{font-size:14px}.info .more{display:none}
  .place{left:20px;right:20px;bottom:22px;justify-content:space-between}
  .card::after{background:linear-gradient(0deg,rgba(2,16,40,.75) 0%,rgba(2,16,40,.15) 55%,rgba(2,16,40,.35) 100%)}
}
</style>
</head>
<body>
<main class="hero">
  <div class="bg"><img class="on" src="assets/r2/s-mountains-bg.jpg?v=r4a" alt=""><img src="assets/r2/s-canyon-bg.jpg?v=r4a" alt=""></div>
  <div class="card h0" id="card">
    <picture><source media="(max-width:860px)" srcset="assets/r2/s-mountains-tall.jpg?v=r4a"><img class="ph on" src="assets/r2/s-mountains.jpg?v=r4a" alt="Кружка The Art of Travel у горах"></picture>
    <picture><source media="(max-width:860px)" srcset="assets/r2/s-canyon-tall.jpg?v=r4a"><img class="ph" src="assets/r2/s-canyon.jpg?v=r4a" alt="Кружка The Art of Travel над каньйоном"></picture>
    <div class="in">
      <div class="contact h0">Зв'язатися з нами<div><a class="ic" href="#">IG</a><a class="ic" href="#">TG</a></div></div>
      <img class="logo h0" src="assets/logo-cream.png" alt="The Art of Travel">
      <div class="menu h0"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про нас</a><a href="#">UA / EN</a><a class="pill" href="#">Залишити заявку</a><a class="mm" href="#" style="display:none">Меню</a></div>
      <div class="ttl"><span class="l1"><em>The Art</em></span><span class="l2"><em>of Travel</em></span></div>
      <div class="info h0"><h3>Спокій за результат</h3><p>Все, що вказано в турі, вже включено в ціну.<span class="more"> Офіційний договір, страхування і своя команда поруч — вам лишається тільки відчувати.</span></p><a href="#">Обрати подорож</a></div>
      <div class="vs h0"><button class="up" aria-label="Попереднє"></button><b></b><button class="dn" aria-label="Наступне"></button></div>
      <div class="place h0"><span id="placeTxt">01 / 02 &nbsp; Гори</span><button aria-label="Назад" class="pv">◀</button><button aria-label="Вперед" class="nx">▶</button></div>
    </div>
  </div>
  <div class="intro" id="intro">
    <video id="steam" src="assets/r2/mug-steam.mp4?v=r4a" poster="assets/r2/mug-steam-poster.jpg?v=r4a" muted playsinline preload="auto"></video>
  </div>
  <div class="mist" id="mist"></div>
</main>
<button class="replay">↻ Інтро ще раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="r2.js?v=r4a"></script>
<script>
const steam = document.getElementById('steam');
// real photos with the mug: arrows / diamond switch them
const names = ['Гори', 'Каньйони']; let cur = 0;
const phs = document.querySelectorAll('.card .ph'), bgs = document.querySelectorAll('.bg img'), placeTxt = document.getElementById('placeTxt');
function go(d){ cur = (cur + d + phs.length) % phs.length;
  phs.forEach((p, i) => p.classList.toggle('on', i === cur)); bgs.forEach((p, i) => p.classList.toggle('on', i === cur));
  placeTxt.style.opacity = 0; setTimeout(() => { placeTxt.innerHTML = `0${cur+1} / 0${phs.length} &nbsp; ${names[cur]}`; placeTxt.style.opacity = 1; }, 300); }
document.querySelectorAll('.pv, .vs .up').forEach(b => b.addEventListener('click', () => go(-1)));
document.querySelectorAll('.nx, .vs .dn').forEach(b => b.addEventListener('click', () => go(1)));

const tl = gsap.timeline({paused: true});
tl.add(() => { steam.currentTime = 0; steam.play().catch(()=>{}); }, 0)
  .from(steam, {opacity: 0, duration: .5}, 0)
  .to(steam, {scale: 2.1, duration: 2.75, ease: 'power2.in'}, 0)
  .to('#mist', {opacity: 1, duration: .8, ease: 'power1.in'}, 1.95)
  .set('#intro', {display: 'none'}, 2.75)
  .set('#card', {opacity: 1}, 2.75)
  .to('#mist', {opacity: 0, duration: 1.0, ease: 'power1.out'}, 2.8)
  .from('.ttl em', {yPercent: 40, opacity: 0, duration: 1.1, stagger: .14, ease: 'power3.out'}, 3.0)
  .to('.logo, .menu, .contact', {opacity: 1, duration: .6}, 3.3)
  .to('.info', {opacity: 1, duration: .7}, 3.5)
  .to('.vs, .place', {opacity: 1, duration: .6}, 3.7);
R2.run(tl, {waitFor: [steam]});
</script>
</body>
</html>
