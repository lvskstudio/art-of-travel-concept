<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варіант 2 · Трикутники — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2.css?v=r4c">
<link rel="preload" as="image" href="assets/r2/t-peak.jpg">
<link rel="preload" as="image" href="assets/r2/t-ocean.jpg">
<link rel="preload" as="image" href="assets/r2/t-falls.jpg">
<link rel="preload" as="image" href="assets/r2/t-ice.jpg">
<style>
body{background:var(--navy);color:var(--cream)}
.hero{position:relative;height:100vh;height:100svh;min-height:640px;overflow:hidden;background:var(--navy)}
/* ---------- intro (Peggys Cove collage): pale word, translucent strips, photo triangles ---------- */
.pale{position:absolute;left:0;right:0;z-index:4;text-align:center;font:800 19vw/1 var(--sans);letter-spacing:-.04em;color:rgba(243,235,221,.05);pointer-events:none}
.strip{position:absolute;z-index:4;top:0;bottom:0;opacity:.32}
.tris{position:absolute;z-index:5;will-change:transform}
.tri{position:absolute;background-size:cover;background-position:center;will-change:transform}
.intro-name{position:absolute;left:0;right:0;z-index:6;text-align:center}
.intro-name b{display:block;font:300 clamp(16px,1.6vw,22px)/1 var(--sans);letter-spacing:.42em;padding-left:.42em}
.intro-name small{display:block;margin-top:14px;font:500 10px/1 var(--sans);letter-spacing:.32em;color:var(--bone);opacity:.7}
.backdrop{position:absolute;inset:0;z-index:3;background:var(--navy)}
.shards{position:absolute;inset:0;z-index:2;pointer-events:none}
.shard{position:absolute;background:var(--navy);will-change:transform}
/* ---------- hero (slate landing): video on top, centred thin+bold headline, row of triangles ---------- */
.reveal{position:absolute;inset:0;z-index:1;overflow:hidden}
.reveal video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reveal::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,26,82,.38) 0%,rgba(2,26,82,.08) 30%,rgba(2,26,82,.08) 65%,rgba(2,26,82,.35) 100%)}
.ui{position:absolute;inset:0;z-index:20;pointer-events:none}
.ui > *{pointer-events:auto}
.h0{opacity:0}
.nav{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);top:26px;display:flex;align-items:center;justify-content:space-between}
.links{display:flex;gap:30px;font:400 13px/1 var(--sans)}
.links a:hover{color:var(--gold)}
.logo{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:86px;opacity:0}
.nr{display:flex;gap:10px;align-items:center}
.nr a{border:1px solid rgba(243,235,221,.7);font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:9px 12px}
.nr a:hover{background:var(--cream);color:var(--navy)}
.nr a.lang{border:0;padding:9px 6px;opacity:.55}
.nr a.lang:hover{background:none;color:var(--cream);opacity:1}
.burger{display:none;width:40px;height:40px;border:1px solid rgba(243,235,221,.7);place-items:center}
.burger span{display:block;width:16px;height:1.5px;background:var(--cream);box-shadow:0 5px 0 var(--cream),0 -5px 0 var(--cream)}
.center{position:absolute;left:0;right:0;top:30%;text-align:center}
.center .sub{font:300 clamp(13px,1.15vw,16px)/1 var(--sans);letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;opacity:.9}
.center h1{margin-top:24px;font:200 clamp(40px,5.8vw,96px)/1.02 var(--sans);letter-spacing:.01em;text-transform:uppercase;text-shadow:0 2px 30px rgba(2,26,82,.35)}
.center h1 b{font-weight:800}
.center p{margin:22px auto 0;max-width:560px;font:400 18px/1.5 var(--sans);opacity:.92;text-shadow:0 1px 16px rgba(2,26,82,.45)}
.perks{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;align-items:center;gap:22px;font:400 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.perks i{width:28px;height:1px;background:rgba(243,235,221,.6)}
.center .btn{display:inline-block;margin-top:28px;border:1px solid rgba(243,235,221,.85);font:500 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:16px 30px}
.center .btn:hover{background:var(--cream);color:var(--navy)}
.center .down{display:block;margin:22px auto 0;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid rgba(243,235,221,.8)}
.row{position:absolute;z-index:21;left:50%;transform:translateX(-50%);display:flex}
.row i{display:block;flex:none;background-size:cover;background-position:center}
.row i.o{position:relative;background:rgba(243,235,221,.85)}
.row i.o::after{content:"";position:absolute;inset:0;background:var(--navy);clip-path:inherit;transform:scale(.965)}
@media (max-width:860px){
  .nav{left:18px;right:18px;top:16px}.links,.nr a{display:none}.burger{display:grid}
  .nav::before{content:"EN";font:500 11px/40px var(--sans);letter-spacing:.14em;opacity:.55}
  .logo{width:48px;top:-4px}
  .center{top:20%;bottom:auto;padding:0 18px}
  .center .sub{font-size:11px;letter-spacing:.3em}
  .center h1{font-size:34px}
  .center p,.center .down,.perks{display:none}
  .center .btn{margin-top:20px;padding:14px 22px}
}
</style>
</head>
<body>
<main class="hero" id="hero">
  <div class="reveal" id="reveal"><video id="cv" muted playsinline preload="auto"></video></div>
  <div class="shards" id="shards"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="strip" id="s1" style="background:#9DB0AC"></div>
  <div class="strip" id="s2" style="background:#D8D0C1"></div>
  <div class="tris" id="tris">
    <div class="tri" style="background-image:url(assets/r2/t-peak.jpg)"></div>
    <div class="tri" style="background-image:url(assets/r2/t-ocean.jpg)"></div>
    <div class="tri" style="background-image:url(assets/r2/t-falls.jpg)"></div>
    <div class="tri" style="background-image:url(assets/r2/t-ice.jpg)"></div>
  </div>
  <div class="intro-name" id="iname"><b>THE ART OF TRAVEL</b><small>EXPLORE · EXPERIENCE · INSPIRE</small></div>

  <div class="ui">
    <nav class="nav h0">
      <div class="links"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про нас</a><a href="#">Контакти</a></div>
      <img class="logo" src="assets/logo-cream.png" alt="The Art of Travel">
      <div class="nr"><a class="lang" href="#">EN</a><a href="#">Залишити заявку</a><button class="burger" aria-label="Меню"><span></span></button></div>
    </nav>
    <div class="center">
      <div class="sub h0">Авторські групові тури</div>
      <h1 class="h0">Подорож, що залишає <b>слід</b></h1>
      <p class="h0">Авторські маршрути, маленькі групи і жодних доплат на місці.</p>
      <a class="btn h0" href="#">Обрати подорож</a>
    </div>
  </div>
</main>
<img id="fly" src="assets/logo-cream.png" alt="" style="position:fixed;z-index:200;object-fit:contain;opacity:0;pointer-events:none">
<button class="replay">↻ Інтро ще раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const tris = $('#tris'), video = $('#cv'), fly = $('#fly');
const mob = innerWidth < 860;
video.src = mob ? 'assets/r2/canyon-tall-m.mp4?v=r4c' : 'assets/r2/canyon-wide.mp4?v=r4c';
video.poster = mob ? 'assets/r2/canyon-tall-poster.jpg?v=r4c' : 'assets/r2/canyon-wide-poster.jpg?v=r4c';
video.muted = true; video.defaultMuted = true; video.setAttribute('muted', ''); video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
let wantPlay = false;
const playVideo = () => { wantPlay = true; const p = video.play(); if (p) p.catch(() => {}); };
video.addEventListener('canplay', () => { if (wantPlay && video.paused) playVideo(); });
['touchstart', 'pointerdown', 'click', 'scroll'].forEach(e => addEventListener(e, () => { if (wantPlay && video.paused) playVideo(); }, {passive: true}));
video.load();

const boxes = [[25,0,50,50,'50% 0,100% 100%,0 100%'],[0,50,50,50,'50% 0,100% 100%,0 100%'],[50,50,50,50,'50% 0,100% 100%,0 100%'],[25,50,50,50,'0 0,100% 0,50% 100%']];
const pieces = document.querySelectorAll('.tri');
function layout(){
  const vw = innerWidth, vh = innerHeight;
  const H = Math.min(vh * (mob ? 0.5 : 0.7), vw * (mob ? 0.8 : 0.62) * 0.866), L = H / 0.866;
  const cx = vw / 2, cy = vh * (mob ? 0.43 : 0.46), gap = Math.max(4, L * 0.008);
  Object.assign(tris.style, {width: L+'px', height: H+'px', left: (cx-L/2)+'px', top: (cy-H/2)+'px'});
  pieces.forEach((p, i) => { const [x,y,w,h,poly] = boxes[i];
    Object.assign(p.style, {left: `calc(${x}% + ${gap}px)`, top: `calc(${y}% + ${gap}px)`, width: `calc(${w}% - ${gap*2}px)`, height: `calc(${h}% - ${gap*2}px)`, clipPath: `polygon(${poly})`}); });
  $('#iname').style.top = (cy + H/2 + 36) + 'px';
  const sw = L*0.16; Object.assign($('#s1').style, {left:(cx - L*0.18)+'px', width:sw+'px'}); Object.assign($('#s2').style, {left:(cx + L*0.06)+'px', width:sw*.8+'px'});
}
layout();
addEventListener('resize', layout);

const shardBox = $('#shards'); let shards = [];
(function buildShards(){
  const vw = innerWidth, vh = innerHeight, cols = mob ? 4 : 8, rows = mob ? 7 : 5;
  const P = []; for (let r = 0; r <= rows; r++) { P[r] = []; for (let c = 0; c <= cols; c++) {
    const edge = r === 0 || c === 0 || r === rows || c === cols;
    P[r][c] = [c/cols*vw + (edge ? 0 : (Math.random()-.5)*vw/cols*.55), r/rows*vh + (edge ? 0 : (Math.random()-.5)*vh/rows*.55)]; } }
  const add = pts => { const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]); const x0 = Math.min(...xs)-1, y0 = Math.min(...ys)-1, w = Math.max(...xs)-x0+1, h = Math.max(...ys)-y0+1;
    const d = document.createElement('div'); d.className = 'shard'; Object.assign(d.style, {left:x0+'px', top:y0+'px', width:w+'px', height:h+'px', clipPath:'polygon('+pts.map(p=>(p[0]-x0)+'px '+(p[1]-y0)+'px').join(',')+')'});
    shardBox.appendChild(d); shards.push({el:d, cx:xs.reduce((a,b)=>a+b)/3, cy:ys.reduce((a,b)=>a+b)/3}); };
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const a = P[r][c], b = P[r][c+1], cc = P[r+1][c+1], d = P[r+1][c];
    if ((r + c) % 2) { add([a,b,cc]); add([a,cc,d]); } else { add([a,b,d]); add([b,cc,d]); } }
})();

const tl = gsap.timeline({paused: true});
const from = [[0,-1],[-1,.5],[1,.5],[0,1.1]];
pieces.forEach((t,i) => tl.from(t, {x: from[i][0]*innerWidth*0.55, y: from[i][1]*innerHeight*0.6, rotation: [0,-30,30,180][i], opacity: 0, duration: .85, ease: 'power3.out'}, i*0.07));
tl.fromTo(tris, {scale: .94}, {scale: 1.08, duration: 1.65, ease: 'none'}, 0)
  .from('#s1', {yPercent: -100, duration: .9, ease: 'power3.out'}, .1)
  .from('#s2', {yPercent: 100, duration: .9, ease: 'power3.out'}, .18)
  .from('#iname > *', {opacity: 0, y: 10, stagger: .1, duration: .5}, .5)
  .to('#iname', {opacity: 0, duration: .3}, 1.2)
  .add(() => { const n = $('#iname').getBoundingClientRect(), w0 = 70, h0 = w0*604/569;
      gsap.set(fly, {left: innerWidth/2 - w0/2, top: n.top - 6, width: w0, height: h0}); }, 1.2)
  .to(fly, {opacity: 1, duration: .35}, 1.25)
  .add(() => { video.currentTime = 0; playVideo(); }, 1.55)
  .to('#s1, #s2', {opacity: 0, duration: .5}, 1.6)
  .set('#backdrop', {opacity: 0}, 1.62);
const out = [[0,-1],[-1,.35],[1,.35],[0,1]];
pieces.forEach((t,i) => tl.to(t, {x: out[i][0]*innerWidth*0.75, y: out[i][1]*innerHeight*0.8, rotation: [0,-40,40,25][i], opacity: 0, duration: 1.05, ease: 'power2.in'}, 1.62 + i*0.04));
tl.add(() => {
  const vw = innerWidth, vh = innerHeight, maxD = Math.hypot(vw, vh) / 2;
  shards.forEach(s => { s.el.style.background = `hsl(222, ${85 + Math.random()*10}%, ${12 + Math.random()*9}%)`;
    const dx = s.cx - vw/2, dy = s.cy - vh/2, d = Math.hypot(dx, dy) || 1;
    gsap.to(s.el, {x: dx/d*(vw*.45 + Math.random()*vw*.3), y: dy/d*(vh*.45 + Math.random()*vh*.3), rotation: (Math.random()-.5)*90, scale: .8, opacity: 0,
      duration: 1.1, ease: 'power2.in', delay: (d/maxD)*0.3}); });
}, 1.62)
  .add(() => { const t = $('.logo').getBoundingClientRect();
      gsap.to(fly, {left: t.left, top: t.top, width: t.width, height: t.height, duration: .9, ease: 'power3.inOut', onComplete: () => { $('.logo').style.opacity = 1; fly.style.opacity = 0; }}); }, 2.75)
  .to('.nav', {opacity: 1, duration: .5}, 3.0)
  .fromTo('.center .sub', {opacity: 0, letterSpacing: '.8em'}, {opacity: .9, letterSpacing: '.42em', duration: 1.1, ease: 'power3.out'}, 2.8)
  .fromTo('.center h1', {opacity: 0, y: 26}, {opacity: 1, y: 0, duration: .9, ease: 'power3.out'}, 2.95)
  .to('.center p, .center .btn', {opacity: 1, duration: .6, stagger: .08}, 3.3)
;
const fast = () => { if (tl.progress() < 1) tl.timeScale(6); };
['wheel','touchstart','keydown','pointerdown'].forEach(e => addEventListener(e, fast, {passive: true, once: true}));
const imgs = ['t-peak','t-ocean','t-falls','t-ice'].map(n => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'assets/r2/'+n+'.jpg'; }));
Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 900))]).then(() => tl.play());
const rp = $('.replay'); tl.eventCallback('onComplete', () => rp.classList.add('on')); rp.addEventListener('click', () => location.reload());
</script>
</body>
</html>
