<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варіант 1 · Крізь букву A — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2.css?v=r4c">
<style>
body{background:var(--bone);color:var(--navy)}
.hero{position:relative;height:100vh;min-height:700px;overflow:hidden}
/* video stage: full screen during the intro, then the rounded hero card (HAVEN) */
.stage{position:absolute;inset:0;z-index:60;overflow:hidden;will-change:clip-path}
.stage video{width:100%;height:100%;object-fit:cover}
.stage .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,16,47,.6) 0%,rgba(1,16,47,.22) 45%,rgba(1,16,47,0) 70%),linear-gradient(0deg,rgba(1,16,47,.45),rgba(1,16,47,0) 40%);opacity:0}
.stage.masked{-webkit-mask-image:url(assets/mark-cream.png);mask-image:url(assets/mark-cream.png);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.intro{position:fixed;inset:0;z-index:50;background:var(--navy)}
.intro-text{position:fixed;left:0;right:0;z-index:70;text-align:center;color:var(--cream);pointer-events:none}
.intro-text .name{font:400 clamp(18px,1.9vw,27px)/1 var(--serif);letter-spacing:.3em}
.intro-text .slogan{margin-top:16px;font:400 12px/1 var(--sans);letter-spacing:.22em;color:#CFC29F}
/* card content */
.ui{position:absolute;z-index:80;left:32px;right:32px;top:24px;height:calc(100% - 224px);color:var(--cream);pointer-events:none}
.ui > *{pointer-events:auto}
.nav{position:absolute;left:30px;right:24px;top:20px;display:flex;align-items:center;justify-content:space-between}
.brand{display:block;line-height:0}
.brand img{height:54px;width:auto;opacity:0}
.links{display:flex;gap:34px;font-size:13px}
.links a{opacity:.92}.links a:hover{opacity:1;color:var(--gold)}
.right{display:flex;gap:12px;align-items:center}
.lang{font:500 11px/1 var(--sans);letter-spacing:.14em;opacity:.55;margin-right:10px}
.lang:hover{opacity:1}
.pill{background:var(--olive);color:var(--bone);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;border-radius:30px}
.burger{width:42px;height:42px;border-radius:50%;background:var(--bone);display:flex;align-items:center;justify-content:center}
.burger{flex-direction:column;gap:4px}
.burger span{display:block;width:16px;height:1.5px;background:var(--navy)}
.copy{position:absolute;left:62px;top:clamp(104px,15vh,150px);max-width:620px}
h1{font:400 clamp(48px,min(6.6vw,10.5vh),104px)/.96 var(--serif);letter-spacing:-.01em}
h1 span{display:block;overflow:hidden}
h1 em{display:block;font-style:normal}
h1 .gold{color:var(--gold)}
.sub{margin-top:22px;font-size:16px;line-height:1.5;opacity:.92;max-width:360px}
.cta{margin-top:26px;display:inline-block;background:var(--olive);color:var(--bone);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:17px 30px;border-radius:40px}
.cta i{width:32px;height:32px;border-radius:50%;background:rgba(232,221,200,.16);display:grid;place-items:center;font-style:normal;letter-spacing:0}
/* values row with icons, connected by thin lines (HAVEN: Tranquil — Authentic — Restorative) */
.values{position:absolute;right:30px;bottom:26px;display:flex;align-items:center;gap:14px;font-size:12px}
.values div{display:flex;align-items:center;gap:9px}
.values svg{width:22px;height:22px}
.values hr{width:34px;border:0;border-top:1px solid rgba(243,235,221,.6)}
.shot{position:absolute;right:30px;top:96px;display:flex;align-items:center;gap:12px;font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:0}
.shot i{width:28px;height:1px;background:var(--gold)}
.shot span{transition:opacity .45s}
/* overlapping cards + side block */
.cards{position:absolute;z-index:85;left:96px;bottom:68px;display:flex;gap:14px}
.card{width:clamp(180px,min(18vw,28vh),260px);aspect-ratio:272/208;border-radius:18px;overflow:hidden;position:relative;border:3px solid var(--bone);box-shadow:0 18px 40px rgba(1,16,47,.22);color:var(--cream)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.card:hover img{transform:scale(1.06)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(1,16,47,.62),rgba(1,16,47,0) 60%)}
.card b{position:absolute;z-index:2;left:16px;bottom:14px;font:400 23px/1.02 var(--serif)}
.card small{position:absolute;z-index:2;right:16px;bottom:16px;font-size:12px;opacity:.9}
.side{position:absolute;z-index:85;left:calc(96px + 3 * clamp(200px,19vw,272px) + 3 * 14px + 26px);right:40px;bottom:78px;color:var(--navy)}
.side .arrows{display:flex;gap:10px;justify-content:flex-end;margin-bottom:22px}
.side .arrows button{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(1,16,47,.12);color:var(--navy);display:grid;place-items:center;font-size:13px}
.side h3{font:600 14px/1.2 var(--sans)}
.side p{margin-top:8px;font-size:13px;line-height:1.5;opacity:.75;max-width:250px}
.side .badges{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:11px;opacity:.85}
.side .badges img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--bone);margin-right:-16px}
.side .badges span{margin-left:20px}
.h0{opacity:0}
@media (max-width:860px){
  .hero{height:100svh;min-height:620px}
  .ui{left:12px;right:12px;top:12px;height:calc(100% - 24px)}
  .nav{left:18px;right:18px;top:18px}.links,.pill,.lang{display:none}
  .brand img{height:44px}
  .copy{left:22px;right:22px;top:auto;bottom:96px}
  h1{font-size:54px}
  .sub{font-size:14px}.sub .more{display:none}
  .values{left:18px;right:18px;bottom:22px;justify-content:space-between;gap:6px;font-size:10px}
  .values hr,.values svg{display:none}
  .shot,.cards,.side{display:none}
  .stage .shade{background:linear-gradient(0deg,rgba(1,16,47,.8) 0%,rgba(1,16,47,.25) 60%,rgba(1,16,47,.35) 100%)}
}
</style>
</head>
<body>
<main class="hero" id="hero">
  <div class="stage masked" id="stage">
    <video id="mv" src="assets/r2/montage.mp4?v=r4c" poster="assets/r2/montage-poster.jpg?v=r4c" muted playsinline loop autoplay preload="auto"></video>
    <div class="shade" id="shade"></div>
  </div>

  <div class="ui" id="ui">
    <nav class="nav h0">
      <a class="brand" href="#"><img src="assets/logo-cream.png" alt="The Art of Travel"></a>
      <div class="links"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про нас</a><a href="#">Контакти</a></div>
      <div class="right"><a class="lang" href="#">EN</a><a class="pill" href="#">Залишити заявку</a><button class="burger" aria-label="Меню"><span></span><span></span><span></span></button></div>
    </nav>
    <div class="copy">
      <h1><span><em>Відкривай.</em></span><span><em>Відчувай.</em></span><span><em class="gold">Надихайся.</em></span></h1>
      <p class="sub h0">Авторські групові тури, які залишають слід.</p>
      <a class="cta h0" href="#">Обрати подорож</a>
    </div>
  </div>

  <div class="cards">
    <a class="card h0" href="#"><img src="assets/r2/card-peaks.jpg" alt=""><b>Гірські<br>маршрути</b></a>
    <a class="card h0" href="#"><img src="assets/r2/cliffs.jpg" alt=""><b>Океан<br>і скелі</b></a>
    <a class="card h0" href="#"><img src="assets/r2/card-falls.jpg" alt=""><b>Північна<br>природа</b></a>
  </div>
</main>

<div class="intro" id="intro"></div>
<div class="intro-text" id="introText">
  <div class="name">THE ART OF TRAVEL</div>
  <div class="slogan">Відкривай · Відчувай · Надихайся</div>
</div>
<img class="flymark" id="flymark" src="assets/logo-cream.png" alt="" style="position:fixed;z-index:200;object-fit:contain;opacity:0;pointer-events:none">
<button class="replay">↻ Інтро ще раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="r2.js?v=r4c"></script>
<script>
const stage = document.getElementById('stage'), video = document.getElementById('mv');
if (innerWidth < 860) video.src = 'assets/r2/montage-m.mp4?v=r4c';
const MW = 426, MH = 388, AX = 0.634, AY = 0.624;
const st = {k: 0, a: 0};
let W0, W1;
function sizes(){
  const vw = innerWidth, vh = innerHeight, mob = vw < 860;
  W0 = Math.min(mob ? vw * 0.72 : vh * 0.62 * MW / MH, 560);
  W1 = Math.hypot(vw, vh) / 0.0535 * 1.15;
  const cy = mob ? vh * 0.42 : vh * 0.45;
  document.getElementById('introText').style.top = (cy + W0 * MH / MW / 2 + 34) + 'px';
  return {vw, vh, cy, mob};
}
let S = sizes();
function applyMask(){
  const W = W0 * Math.pow(W1 / W0, st.k), H = W * MH / MW;
  const ax = 0.5 + (AX - 0.5) * st.a, ay = 0.5 + (AY - 0.5) * st.a;
  stage.style.webkitMaskSize = stage.style.maskSize = `${W}px ${H}px`;
  stage.style.webkitMaskPosition = stage.style.maskPosition = `${S.vw / 2 - ax * W}px ${S.cy - ay * H}px`;
}
applyMask();
const cardInset = () => innerWidth < 860 ? 'inset(12px 12px 12px 12px round 22px)' : 'inset(24px 32px 200px 32px round 28px)';
addEventListener('resize', () => { S = sizes(); if (stage.classList.contains('masked')) applyMask(); else stage.style.clipPath = cardInset(); });

const tl = gsap.timeline({paused: true});
tl.from(stage, {opacity: 0, duration: .5, ease: 'power1.out'}, 0)
  .fromTo(st, {k: -0.06}, {k: 1, duration: 2.7, ease: 'power3.in', onUpdate: applyMask}, 0)
  .fromTo(st, {a: 0}, {a: 1, duration: 2.7, ease: 'power4.in', immediateRender: false}, 0)
  .from('#introText > *', {opacity: 0, y: 10, stagger: .1, duration: .5, ease: 'power2.out'}, .15)
  .to('#introText', {opacity: 0, y: 24, duration: .5, ease: 'power2.in'}, 1.05)
  .to('#intro', {opacity: 0, duration: .3}, 2.45)
  .add(() => { stage.classList.remove('masked'); stage.style.webkitMaskImage = stage.style.maskImage = 'none'; stage.style.clipPath = 'inset(0px 0px 0px 0px round 0px)'; }, 2.72)
  .set('#intro', {display: 'none'}, 2.75)
  .to(stage, {clipPath: () => cardInset(), duration: .9, ease: 'power3.inOut'}, 2.75)
  .to('#shade', {opacity: 1, duration: .7}, 2.95)
  .add(() => { const fm = document.getElementById('flymark'), t = document.querySelector('.brand img').getBoundingClientRect(), w0 = Math.min(110, innerWidth*.24), h0 = w0*604/569;
      gsap.set(fm, {left: innerWidth/2 - w0/2, top: innerHeight/2 - h0/2, width: w0, height: h0, opacity: 0});
      gsap.timeline().to(fm, {opacity: 1, duration: .25}).to(fm, {left: t.left, top: t.top, width: t.width, height: t.height, duration: .9, ease: 'power3.inOut'}, .15)
        .set('.brand img', {opacity: 1}).set(fm, {opacity: 0}); }, 2.95)
  .to('.nav', {opacity: 1, duration: .5}, 3.2)
  .from('h1 em', {yPercent: 110, duration: .8, stagger: .12, ease: 'power3.out'}, 3.25)
  .to('.sub, .cta', {opacity: 1, duration: .5, stagger: .08}, 3.65)
  .fromTo('.card', {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: .7, stagger: .08, ease: 'power3.out'}, 3.6)
;
R2.run(tl, {waitFor: [video]});
</script>
</body>
</html>
