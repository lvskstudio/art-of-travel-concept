<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варіант B · Тиха розкіш — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2.css?v=r5a">
<style>
body{background:var(--bone);color:var(--navy)}
.hero{position:relative;height:100vh;height:100svh;min-height:660px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#F3EBDD,#E6DAC4)}
.nav{position:absolute;z-index:4;top:22px;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);display:flex;align-items:center;justify-content:space-between}
.logo{height:56px}
.links{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:34px;font:500 14px/1 var(--sans)}
.links a:hover{color:var(--gold)}
.nr{display:flex;align-items:center;gap:18px}
.lang{font:500 11px/1 var(--sans);letter-spacing:.14em;opacity:.55}
.pill{background:var(--navy);color:var(--cream);font:600 13px/1 var(--sans);padding:14px 22px;border-radius:999px}
.burger{display:none;width:42px;height:42px;border-radius:50%;background:var(--navy);flex-direction:column;align-items:center;justify-content:center;gap:4px}
.burger span{width:16px;height:1.5px;background:var(--cream)}
.title{position:absolute;z-index:3;left:0;right:0;top:11.5vh;text-align:center;font:300 clamp(54px,min(8.6vw,14vh),150px)/1 var(--serif);letter-spacing:-.005em;white-space:nowrap}
.row{position:absolute;z-index:3;left:0;right:0;top:calc(11.5vh + min(8.6vw,14vh) + 18px);display:flex;justify-content:center;align-items:center;gap:28px}
.row p{font-size:16px;opacity:.85}
.cta{background:var(--navy);color:var(--cream);font:600 14px/1 var(--sans);padding:16px 28px;border-radius:999px}
.cta:hover{background:var(--olive)}
/* the organic window: full screen during the intro, then it settles under the title */
.win{position:absolute;z-index:6;left:7vw;right:7vw;top:39vh;bottom:5vh;overflow:hidden;border-radius:16% 30% 22% 34% / 38% 32% 44% 36%;transform-origin:50% 50%;will-change:transform;box-shadow:0 30px 80px rgba(60,45,25,.18)}
.win video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mark{position:absolute;z-index:7;left:50%;top:50%;width:110px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.h0{opacity:0}
@media (max-width:860px){
  .links,.pill,.lang{display:none}.burger{display:flex}
  .logo{height:44px}
  .title{top:14vh;font-size:15vw;white-space:normal;line-height:.95;padding:0 16px}
  .row{top:calc(14vh + 31vw);flex-direction:column;gap:16px}
  .row p{font-size:14px;text-align:center;padding:0 24px}
  .win{left:16px;right:16px;top:52vh;bottom:18px;border-radius:30% 40% 26% 36% / 22% 26% 18% 24%}
}
</style>
</head>
<body>
<main class="hero">
  <nav class="nav h0">
    <img class="logo" src="assets/logo-navy.png" alt="The Art of Travel">
    <div class="links"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про нас</a><a href="#">Контакти</a></div>
    <div class="nr"><a class="lang" href="#">EN</a><a class="pill" href="#">Залишити заявку</a><button class="burger" aria-label="Меню"><span></span><span></span><span></span></button></div>
  </nav>
  <h1 class="title"><span>THE ART OF TRAVEL</span></h1>
  <div class="row h0"><p>Авторські групові тури, які залишають слід.</p><a class="cta" href="#">Обрати подорож</a></div>
  <div class="win" id="win"><video id="v" muted playsinline preload="auto"></video></div>
  <img class="mark" id="mark" src="assets/logo-cream.png" alt="">
</main>
<button class="replay">↻ Інтро ще раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="r2.js?v=r5a"></script>
<script>
const v = document.getElementById('v'), win = document.getElementById('win'), mob = innerWidth < 860;
v.src = mob ? 'assets/r2/ocean-calm-m.mp4?v=r5a' : 'assets/r2/ocean-calm.mp4?v=r5a'; v.poster = 'assets/r2/ocean-calm-poster.jpg?v=r5a';
v.muted = true; v.setAttribute('playsinline', ''); v.load();
const play = () => { const p = v.play(); if (p) p.catch(() => {}); };
v.addEventListener('canplay', () => { if (v.paused) play(); });
// FLIP: the window sits in its final place; at the start it is scaled up to fill the screen
const cover = () => { const r = win.getBoundingClientRect(); return {x: innerWidth/2 - (r.left + r.width/2), y: innerHeight/2 - (r.top + r.height/2), scale: Math.max(innerWidth/r.width, innerHeight/r.height) * 1.25}; };
gsap.set(win, cover());
const tl = gsap.timeline({paused: true});
// calm ocean full screen with the logo, then it becomes the organic window under the big title
tl.add(play, 0)
  .from(v, {opacity: 0, duration: .6}, 0)
  .to('#mark', {opacity: 1, duration: .7}, .25)
  .to('#mark', {opacity: 0, scale: .9, duration: .5}, 1.6)
  .to(win, {x: 0, y: 0, scale: 1, duration: 1.4, ease: 'power3.inOut'}, 1.7)
  .from('.title span', {opacity: 0, letterSpacing: '.12em', duration: 1.4, ease: 'power3.out'}, 2.3)
  .to('.nav', {opacity: 1, duration: .6}, 2.7)
  .to('.row', {opacity: 1, duration: .6}, 2.9);
R2.run(tl, {startDelay: 100, waitFor: []});
</script>
</body>
</html>
