<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C1 · Трейлер — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@400;500;600&family=Oswald:wght@300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20261118d">
<style>
:root{--cream:#F4EEE3;--gold:#CB9846;--ink:#0B1430}
.pin{position:relative;height:100vh;overflow:hidden;background:#050505;color:var(--cream)}
.clip{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.clip.on{opacity:1}
.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.55),rgba(5,7,13,.12) 30%,rgba(5,7,13,.2) 62%,rgba(5,7,13,.78));pointer-events:none}
.bar{position:absolute;left:0;right:0;height:max(0px,calc((100vh - 41.84vw)/2));background:#050505;z-index:6}
.bar.top{top:0}.bar.bot{bottom:0}
.card{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,5,.35)}
.card img{width:72px;animation:fade 1s .3s both}
.card h2{font:300 clamp(52px,6.4vw,96px)/1 'Cormorant Garamond',serif;letter-spacing:.12em;margin-top:22px;animation:rise 1.4s .6s both}
.card p{font:300 18px/1 'Oswald';letter-spacing:.7em;color:var(--gold);margin-top:22px;animation:fade 1s 1.3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;letter-spacing:.3em}to{opacity:1;letter-spacing:.12em}}
.ui{position:absolute;inset:0;z-index:5}
.nav{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font:600 18px/1 'Cormorant Garamond',serif;letter-spacing:.16em}
.brand img{height:32px}
.menu{display:flex;gap:34px;font:500 14px/1 'Manrope'}
.right{display:flex;align-items:center;gap:22px;font:500 13px/1 'Manrope';letter-spacing:.1em}
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:999px;font:600 15px/1 'Manrope';padding:17px 28px;background:var(--cream);color:var(--ink);transition:transform .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn.sm{font-size:14px;padding:12px 22px}
.btn.ghost{background:rgba(10,14,28,.35);color:var(--cream);border:1px solid rgba(244,238,227,.5)}
.btn.ghost i{width:0;height:0;border-left:10px solid var(--cream);border-top:6px solid transparent;border-bottom:6px solid transparent}
.chip{position:absolute;left:0;right:0;top:24vh;text-align:center;font:500 12px/1 'Manrope';letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.chip span{display:inline-block;padding:11px 18px;border:1px solid rgba(244,238,227,.45);border-radius:999px;background:rgba(10,14,28,.3)}
.ptitle{position:absolute;top:31vh;left:0;right:0;text-align:center;font:300 8.6vw/1 'Cormorant Garamond',serif;white-space:nowrap}
.tag{position:absolute;top:calc(31vh + 11.6vw);left:0;right:0;text-align:center;font:400 clamp(22px,2.2vw,30px)/1.3 'Cormorant Garamond',serif;opacity:.95}
.btns{position:absolute;top:calc(31vh + 11.6vw + 64px);left:0;right:0;display:flex;justify-content:center;gap:14px}
.ptitle,.tag,.chip{text-shadow:0 2px 26px rgba(0,0,0,.5)}
.foot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;font:500 12px/1 'Manrope';letter-spacing:.16em;text-transform:uppercase}
.loc{display:flex;align-items:center;gap:12px}
.loc b{font-weight:600;letter-spacing:.2em}
.dots{display:flex;gap:8px}
.dots i{width:28px;height:2px;background:rgba(244,238,227,.35);border-radius:2px;overflow:hidden;position:relative}
.dots i.on::after{content:"";position:absolute;inset:0;background:var(--cream);animation:prog 4.2s linear forwards;transform-origin:left}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:1100px){.menu{display:none}}
@media (max-width:760px){.nav,.foot{left:20px;right:20px}.btns{flex-direction:column;align-items:center}}
@media (prefers-reduced-motion:reduce){.clip{transition:none}}
</style>
</head>
<body data-variant="c1">
<section class="pin">
  <div class="clip on" data-loc="Ісландія"><video src="assets/c1-canyon.mp4?v=20261118d" poster="assets/canyon-poster.jpg?v=20261118d" muted loop playsinline autoplay></video></div>
  <div class="clip" data-loc="Тенерифе"><video src="assets/c1-coast.mp4?v=20261118d" poster="assets/coast-poster.jpg?v=20261118d" muted loop playsinline></video></div>
  <div class="clip" data-loc="Тенерифе"><video src="assets/c2-ocean.mp4?v=20261118d" poster="assets/ocean-poster.jpg?v=20261118d" muted loop playsinline></video></div>
  <div class="shade"></div>
  <div class="bar top"></div><div class="bar bot"></div>
  <div class="card"><img src="assets/mark-gold.png" alt=""><h2>THE ART OF TRAVEL</h2><p>СЕЗОН 2027</p></div>
  <div class="ui">
    <header class="nav pv">
      <div class="brand"><img src="assets/mark-cream.png" alt="">THE ART OF TRAVEL</div>
      <nav class="menu"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про мене</a><a href="#">Відгуки</a><a href="#">Контакти</a></nav>
      <div class="right"><span>UA / EN</span><a class="btn sm" href="#">Залишити заявку</a></div>
    </header>
    <div class="chip pv"><span>Сезон 2027 · календар відкрито</span></div>
    <h1 class="ptitle pv">THE ART OF TRAVEL</h1>
    <div class="tag pv">Авторські групові тури з увагою до кожної деталі</div>
    <div class="btns pv"><a class="btn ghost" href="#"><i></i>Дивитись відео</a><a class="btn" href="#">Обрати подорож &nbsp;→</a></div>
    <div class="foot pv"><div class="loc">Зараз у кадрі: <b class="where">Ісландія</b></div><div class="dots"><i class="on"></i><i></i><i></i></div><div>Звук ○</div></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="shared.js?v=20261118d"></script>
<script>
// live reel: the hero background keeps cutting between the tour videos
const clips = [...document.querySelectorAll('.clip')], dots = [...document.querySelectorAll('.dots i')], where = document.querySelector('.where');
let cur = 0;
function show(i) {
  clips.forEach((c, k) => { c.classList.toggle('on', k === i); const v = c.querySelector('video'); if (k === i) { v.currentTime = 0; v.play().catch(() => {}); } else { setTimeout(() => { if (!c.classList.contains('on')) v.pause(); }, 1200); } });
  dots.forEach((d, k) => { d.classList.remove('on'); if (k === i) { void d.offsetWidth; d.classList.add('on'); } });
  where.textContent = clips[i].dataset.loc;
}
setInterval(() => { cur = (cur + 1) % clips.length; show(cur); }, 4200);

// intro: title card over the reel (~3.2s), then the black bars open and the hero appears
gsap.set('.pv', { opacity: 0, y: 20 });
const tl = gsap.timeline({ paused: true });
tl.to('.card', { opacity: 0, duration: .6 }, 0)
  .to('.bar.top', { yPercent: -100, duration: 1.1, ease: 'power3.inOut' }, .1)
  .to('.bar.bot', { yPercent: 100, duration: 1.1, ease: 'power3.inOut' }, .1)
  .to('.pv', { opacity: 1, y: 0, stagger: .1, duration: .7, ease: 'power2.out' }, .7);
autoIntro(tl, 3.2);
</script>
</body>
</html>
