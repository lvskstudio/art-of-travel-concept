<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N3 · Крізь знак — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=20261118d">
<style>
/* Through the mark: the brand's "A" is a window onto the real footage; the window opens until it is the whole screen.
   Quiet, centred, expensive: one serif statement, one button. */
:root{--cream:#F2ECE2;--navy:#021A52;--gold:#C9974A;--serif:'Cormorant Garamond',Georgia,serif;--text:'Manrope',system-ui,sans-serif}
.k{position:relative;height:100vh;min-height:620px;overflow:hidden;background:var(--cream);color:#F7F2EA}
.k video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.18)}
.veil{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,rgba(4,10,24,.42),rgba(4,10,24,.58)),linear-gradient(180deg,rgba(4,10,24,.35),transparent 25%)}
.center{text-shadow:0 2px 30px rgba(0,0,0,.35)}
.sheet{position:absolute;inset:0;z-index:4;background:var(--cream);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0),url(assets/mark-cream.png) var(--mx,50%) var(--my,46%)/auto 34vh no-repeat;
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0),url(assets/mark-cream.png) var(--mx,50%) var(--my,46%)/auto 34vh no-repeat;
  mask-composite:exclude;will-change:transform}
.word{position:absolute;left:0;right:0;top:calc(46% + 21vh);z-index:5;text-align:center;font:500 15px/1 var(--text);letter-spacing:.5em;color:var(--navy)}
.ui{position:absolute;inset:0;z-index:3}
.nav{position:absolute;top:28px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:center;font:500 13px/1 var(--text)}
.nav .menu{display:flex;gap:30px}
.nav img{position:absolute;left:50%;top:-8px;transform:translateX(-50%);height:62px}
.nav .r{display:flex;gap:22px;align-items:center}
.nav .btn{padding:12px 20px;border-radius:999px;border:1px solid rgba(247,242,234,.6)}
.center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.eyebrow{font:500 12px/1 var(--text);letter-spacing:.32em;text-transform:uppercase;opacity:.9}
.h1{font:300 clamp(60px,8vw,132px)/.92 var(--serif);letter-spacing:-.01em;margin:26px auto 0;text-wrap:balance}
.h1 em{font-style:italic}
.sub{font-size:17px;line-height:1.6;max-width:460px;margin:26px auto 0;opacity:.9}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:18px 30px;border-radius:999px;background:#F7F2EA;color:var(--navy);font:600 14px/1 var(--text);transition:transform .3s}
.cta:hover{transform:translateY(-2px)}
.foot{position:absolute;left:48px;right:48px;bottom:36px;display:flex;justify-content:space-between;font:500 12px/1 var(--text);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.fade{opacity:0}
@media (max-width:900px){.nav .menu,.foot span:nth-child(2){display:none}.nav{left:20px;right:20px}.foot{left:20px;right:20px}}
</style>
</head>
<body data-variant="n3">
<section class="k">
  <video src="assets/real-coast.mp4?v=20261118d" muted loop playsinline autoplay preload="auto"></video>
  <div class="veil fade"></div>
  <div class="ui">
    <header class="nav fade">
      <nav class="menu"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про мене</a></nav>
      <img src="assets/logo-cream.png" alt="The Art of Travel">
      <div class="r"><span>UA / EN</span><a class="btn" href="#">Залишити заявку</a></div>
    </header>
    <div class="center">
      <div class="eyebrow fade">Авторські групові тури · сезон 2027</div>
      <h1 class="h1 fade">Мистецтво<br><em>подорожувати</em></h1>
      <p class="sub fade">Маленькі групи, свої люди поруч і маршрут, продуманий до кожної деталі.</p>
      <a class="cta fade" href="#">Обрати подорож &nbsp;→</a>
    </div>
    <div class="foot fade"><span>Explore · Experience · Inspire</span><span>Офіційний туроператор</span><span>Гортай ↓</span></div>
  </div>
  <div class="sheet"></div>
  <div class="word">THE ART OF TRAVEL</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="shared.js?v=20261118d"></script>
<script>
// the zoom grows from the thickest part of the "A" (right foot), so the opening always fills the screen
const sheet = document.querySelector('.sheet');
function origin() {
  const H = innerHeight, W = innerWidth, mh = H * .34, mw = mh * 426 / 388;
  const left = (W - mw) * .5, top = (H - mh) * .46;
  sheet.style.transformOrigin = `${left + mw * .728}px ${top + mh * .925}px`;
}
origin(); addEventListener('resize', origin);
gsap.set(sheet, { opacity: 0 }); gsap.set('.word', { opacity: 0, y: 10 });
const intro = gsap.timeline({ paused: true });
intro.to(sheet, { opacity: 1, duration: .01 })
  .to('.word', { opacity: 1, y: 0, duration: .9, ease: 'power2.out' }, .3)
  .to('.word', { opacity: 0, duration: .4 }, 1.9)
  .to(sheet, { scale: 70, duration: 1.7, ease: 'power3.in' }, 2.0)
  .to('video', { scale: 1, duration: 2.6, ease: 'power2.out' }, 2.0)
  .to('.fade', { opacity: 1, duration: .9, stagger: .09 }, 3.3)
  .add(() => { sheet.remove(); document.querySelector('.word').remove(); });
const v = document.querySelector('video');
let started = false; const start = () => { if (!started) { started = true; intro.play(); } };
if (v.readyState >= 2) start(); else { v.addEventListener('loadeddata', start, { once: true }); setTimeout(start, 1500); }
const skip = () => { start(); intro.timeScale(6); off(); };
const evs = ['wheel', 'touchstart', 'keydown', 'mousedown'];
const off = () => evs.forEach(e => removeEventListener(e, skip));
evs.forEach(e => addEventListener(e, skip, { passive: true }));
intro.eventCallback('onComplete', off);
</script>
</body>
</html>
