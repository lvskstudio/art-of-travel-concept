<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Тиха розкіш — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--navy:#021A52;--gold:#C9974A;--cream:#F4EEE3}
.pin{position:relative;height:100vh;overflow:hidden;background:var(--cream)}
.nav{position:absolute;top:28px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;color:var(--navy);z-index:5}
.brand{display:flex;align-items:center;gap:12px;font:600 18px/1 'Cormorant Garamond',serif;letter-spacing:.16em}
.brand img{height:32px}
.menu{display:flex;gap:34px;font:500 14px/1 'Manrope'}
.right{display:flex;align-items:center;gap:22px;font:500 13px/1 'Manrope';letter-spacing:.1em}
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:999px;font:600 15px/1 'Manrope';padding:17px 28px;background:var(--navy);color:var(--cream);transition:transform .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn.sm{font-size:14px;padding:12px 22px}
.big{position:absolute;left:0;right:0;top:10.2vh;text-align:center;font:300 8.6vw/1 'Cormorant Garamond',serif;color:var(--navy);white-space:nowrap;z-index:2}
/* window: final box = Figma hero (x 56..1384, y 29.5vh..88vh), organic blob via objectBoundingBox clip-path */
.win{position:absolute;z-index:3;clip-path:url(#blobClip);-webkit-clip-path:url(#blobClip);will-change:top,left,width,height}
.win video,.win .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.win .still{background:url(assets/dolomites.jpg) center 45%/cover;opacity:0;transform:scale(1.08)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);background:rgba(2,26,82,.38)}
.ov img{width:124px;animation:fade 1s .2s both}
.ov .t{font:500 26px/1 'Cormorant Garamond',serif;letter-spacing:.42em;margin-top:30px;animation:fade 1s .6s both}
.ov .s{font:500 12px/1 'Manrope';letter-spacing:.3em;text-transform:uppercase;margin-top:18px;animation:fade 1s 1s both}
.cta{position:absolute;left:50%;transform:translateX(-50%);top:calc(29.5vh - 26px);z-index:4}
.glass{position:absolute;right:calc(3.9vw + 44px);bottom:calc(12vh + 40px);z-index:4;padding:18px 22px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#fff}
.glass small{display:block;font:500 11px/1 'Manrope';letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.glass b{display:block;font:500 24px/1.1 'Cormorant Garamond',serif;margin-top:8px}
.row{position:absolute;left:56px;right:56px;bottom:3.6vh;display:flex;justify-content:space-between;align-items:center;color:var(--navy);z-index:4}
.row .l{font:400 30px/1 'Cormorant Garamond',serif}
.row .c{font:500 14px/1 'Manrope';opacity:.75;letter-spacing:.04em}
.row .r{font:500 12px/1 'Manrope';letter-spacing:.22em;text-transform:uppercase;opacity:.7}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:1100px){.menu{display:none}}
@media (max-width:900px){.row .c{display:none}.nav{left:20px;right:20px}}
</style>
</head>
<body data-variant="b">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="blobClip" clipPathUnits="objectBoundingBox"><path id="blobPath" d="M0 0H1V1H0Z"/></clipPath></svg>
<section class="pin">
  <header class="nav hv">
    <div class="brand"><img src="assets/mark-gold.png" alt="">THE ART OF TRAVEL</div>
    <nav class="menu"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про мене</a><a href="#">Відгуки</a><a href="#">Контакти</a></nav>
    <div class="right"><span>UA / EN</span><a class="btn sm" href="#">Залишити заявку</a></div>
  </header>
  <h1 class="big hv">THE ART OF TRAVEL</h1>
  <div class="win">
    <video src="assets/b-montage.mp4" poster="assets/coast-poster.jpg" autoplay muted loop playsinline></video>
    <div class="still"></div>
    <div class="ov">
      <img src="assets/mark-gold.png" alt="">
      <div class="t">THE ART OF TRAVEL</div>
      <div class="s">Explore · Experience · Inspire</div>
    </div>
  </div>
  <div class="glass hv"><small>Explore · Experience · Inspire</small><b>Офіційний туроператор</b></div>
  <a class="btn cta hv" href="#">Календар подорожей &nbsp;→</a>
  <div class="row hv"><span class="l">Мистецтво подорожувати разом</span><span class="c">Гори, океан і свої люди поруч</span><span class="r">Гортайте ↓</span></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="shared.js"></script>
<script>
// Blob outline from the Figma frame (normalised 0..1); m = 0 is a plain rectangle, m = 1 the organic shape
const P = [[.04,.16],[.13,.03],[.30,.10],[.45,.07],[.60,.04],[.80,0],[.93,.10],[1,.22],[.985,.45],[.975,.62],[1,.85],[.90,.97],[.72,.94],[.55,.96],[.36,1],[.15,.99],[.04,.90],[0,.70],[.02,.50],[0,.32]];
const R = P.map(([x, y]) => Math.min(x, 1 - x) < Math.min(y, 1 - y) ? [Math.round(x), y] : [x, Math.round(y)]);
const path = document.getElementById('blobPath');
const st = { m: 0, wob: 0 };
function draw(t) {
  const pts = P.map((p, i) => {
    const w = st.wob * .012 * Math.sin(t / 1400 + i * 1.7);
    return [R[i][0] + (p[0] - R[i][0]) * st.m + w, R[i][1] + (p[1] - R[i][1]) * st.m + w * .8];
  });
  if (st.m === 0) { path.setAttribute('d', 'M0 0H1V1H0Z'); return; }
  const n = pts.length; let d = `M ${(pts[0][0] + pts[n - 1][0]) / 2} ${(pts[0][1] + pts[n - 1][1]) / 2}`;
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; d += ` Q ${p[0]} ${p[1]} ${(p[0] + q[0]) / 2} ${(p[1] + q[1]) / 2}`; }
  path.setAttribute('d', d + ' Z');
}
(function loop(t) { draw(t || 0); requestAnimationFrame(loop); })();

const win = document.querySelector('.win');
gsap.set(win, { top: 0, left: 0, width: '100vw', height: '100vh' });
gsap.set('.hv', { opacity: 0 });
gsap.set('.big', { y: 50 });
// ~2.6s of full-screen video, then 1.6s: video shrinks into the window and settles on the Dolomites, as in Figma
const tl = gsap.timeline({ paused: true });
tl.to('.ov', { opacity: 0, duration: .4 }, 0)
  .to(win, { top: '29.5vh', left: '3.9vw', width: '92.2vw', height: '58.5vh', ease: 'power3.inOut', duration: 1.5 }, 0)
  .to(st, { m: 1, ease: 'power2.inOut', duration: 1.5 }, 0)
  .to('.still', { opacity: 1, duration: 1, ease: 'none' }, .5)
  .call(() => gsap.to('.still', { scale: 1, duration: 7, ease: 'none' }), null, .5)
  .to('.big', { opacity: 1, y: 0, duration: .8, ease: 'power2.out' }, .7)
  .to('.nav', { opacity: 1, duration: .6 }, .9)
  .to('.cta, .glass', { opacity: 1, duration: .6 }, 1.1)
  .to('.row', { opacity: 1, duration: .6 }, 1.2)
  .to(st, { wob: 1, duration: 1 }, 1.4);
autoIntro(tl, 2.6);
</script>
</body>
</html>
