<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Варіант Г — The Art of Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="r2.css?v=r6d">
<style>
body{background:var(--navy);color:var(--navy)}
.hero{position:relative;height:100vh;height:100svh;min-height:620px;overflow:hidden;background:var(--navy)}
/* the photo and the cut-out mountain share one geometry; the title sits between them */
.ph{position:absolute;left:calc(50% - max(55.55vw,82.5vh));top:-6.46vw;width:max(111.1vw,165vh);aspect-ratio:3/2;background-size:cover;background-position:center;will-change:transform}
.photo{background-image:url(assets/dolomites.jpg)}
.cut{background-image:url(assets/dolomites-cut.webp);z-index:3}
.fog{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(244,245,246,.4),rgba(244,245,246,.6) 50%,rgba(244,245,246,.35))}
.title{position:absolute;left:0;right:0;top:8.2vw;z-index:2;text-align:center;font:500 9.9vw/1 var(--serif);letter-spacing:-.015em;white-space:nowrap;will-change:transform}
.shade{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(55% 45% at 14% 96%,rgba(2,16,40,.5),rgba(2,16,40,.12) 60%,transparent 100%);opacity:0}
.intro-s{position:absolute;left:0;right:0;top:calc(50vh + 6vw);z-index:5;text-align:center;font:500 12px/1 var(--sans);letter-spacing:.4em;opacity:0}
.nav{position:absolute;z-index:6;top:22px;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);height:72px;display:flex;align-items:center;justify-content:space-between}
.links{display:flex;gap:30px;font:500 13px/1 var(--sans)}
.links a:hover{color:var(--gold)}
.logo{position:absolute;left:50%;top:-6px;height:82px;transform:translateX(-50%)}
.nr{display:flex;align-items:center;gap:18px}
.lang{font:500 11px/1 var(--sans);letter-spacing:.14em;opacity:.55}
.pill{background:var(--navy);color:var(--cream);font:600 13px/1 var(--sans);padding:14px 22px;border-radius:999px}
.burger{display:flex;width:42px;height:42px;border-radius:50%;background:var(--navy);flex-direction:column;align-items:center;justify-content:center;gap:4px}
.burger span{width:16px;height:1.5px;background:var(--cream)}
.copy{position:absolute;z-index:5;left:clamp(20px,4.2vw,60px);bottom:clamp(40px,8vh,80px);color:var(--cream)}
.copy h2{font:500 clamp(56px,min(7.2vw,12vh),124px)/.94 var(--serif);letter-spacing:-.01em;text-shadow:0 2px 24px rgba(2,16,40,.35)}
.copy p{margin-top:20px;font-size:21px;font-weight:500;opacity:.95;text-shadow:0 1px 14px rgba(2,16,40,.4)}
.cta{display:inline-block;margin-top:24px;background:var(--cream);color:var(--navy);font:600 14px/1 var(--sans);padding:17px 30px;border-radius:999px}
.cta:hover{background:var(--gold)}
.h0{opacity:0}
.nav .links,.nav .nr{opacity:0}
.ilogo{position:fixed;z-index:20;left:50%;top:42%;height:clamp(150px,24vh,230px);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
@media (max-width:860px){
  .links,.pill,.lang{display:none}.burger{display:flex}
  .logo{height:56px;left:20px;transform:none;top:4px}
  .nav{justify-content:flex-end}
  .ph{left:calc(50vw - 74svh);width:165svh;top:-6svh}
  .title{top:18svh;font-size:17vw;white-space:normal;line-height:.95}
  .copy h2{font-size:46px}
}
</style>
</head>
<body>
<main class="hero">
  <div class="ph photo"></div>
  <h1 class="title"><span>THE ART OF TRAVEL</span></h1>
  <div class="ph cut"></div>
  <div class="shade"></div>
  <nav class="nav">
    <div class="links"><a href="#">Тури</a><a href="#">Календар 2027</a><a href="#">Про нас</a><a href="#">Контакти</a></div>
    <img class="logo" src="assets/logo-navy.png" alt="The Art of Travel" style="opacity:0">
    <div class="nr"><a class="lang" href="#">EN</a><button class="burger" aria-label="Меню"><span></span><span></span><span></span></button></div>
  </nav>
  <div class="copy h0">
    <h2>Кожна подорож —<br>особлива</h2>
    <p>Авторські групові тури, які залишають слід.</p>
    <a class="cta" href="#">Обрати подорож</a>
  </div>
</main>
<img class="ilogo" id="ilogo" src="assets/logo-navy.png" alt="">
<button class="replay">↻ Інтро ще раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="r2.js?v=r6d"></script>
<script>
const title = document.querySelector('.title');
// intro: the camera starts close in the sky with the LOGO; the logo flies into the menu,
// the camera pulls back, the name appears and the mountain comes forward in front of it.
gsap.set('.ph', {scale: 1.5, transformOrigin: '50% 0%'});
gsap.set('.cut', {opacity: 0});
gsap.set(title, {opacity: 0, scale: 1.12, y: () => -innerHeight * .03});
const ilogo = document.getElementById('ilogo'), navLogo = document.querySelector('.nav .logo');
const tl = gsap.timeline({paused: true});
tl.from('.photo', {opacity: 0, duration: .7}, 0)
  .fromTo(ilogo, {opacity: 0, scale: 1.06}, {opacity: 1, scale: 1, duration: .9, ease: 'power2.out'}, .2)
  .add(() => { const t = navLogo.getBoundingClientRect(), r = ilogo.getBoundingClientRect();
      gsap.to(ilogo, {x: (t.left + t.width/2) - (r.left + r.width/2), y: (t.top + t.height/2) - (r.top + r.height/2), scale: t.height / r.height,
        duration: .9, ease: 'power3.inOut', onComplete: () => { navLogo.style.opacity = 1; ilogo.style.display = 'none'; }}); }, 1.25)
  .to('.ph', {scale: 1, duration: 2.1, ease: 'power2.inOut'}, 1.2)
  .fromTo(title, {letterSpacing: '.18em'}, {opacity: 1, letterSpacing: '-.015em', duration: 1.3, ease: 'power2.out'}, 1.5)
  .to(title, {scale: 1, y: 0, duration: 1.9, ease: 'power2.inOut'}, 1.4)
  .to('.cut', {opacity: 1, duration: .9, ease: 'power1.inOut'}, 2.0)
  .to('.shade', {opacity: 1, duration: .8}, 3.0)
  .to('.nav .links, .nav .nr', {opacity: 1, duration: .6}, 2.3)
  .fromTo('.copy', {opacity: 0, y: 24}, {opacity: 1, y: 0, duration: .8, ease: 'power3.out'}, 3.2);
R2.run(tl, {startDelay: 100, waitFor: []});
</script>
</body>
</html>
